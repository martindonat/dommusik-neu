{{ with .events }}
<section class="section section--events" id="veranstaltungen">
  <div class="shell">
    <header class="section-heading section-heading--row">
      <div>
        <p class="eyebrow eyebrow--dark">Termine</p>
        <h2>Aktuelle Veranstaltungen</h2>
      </div>
      <a class="text-link text-link--large" href="{{ "/veranstaltungen/" | relURL }}">
        Zum Kalender <span aria-hidden="true">→</span>
      </a>
    </header>

    <div class="event-grid">
      {{ range . }}
        {{ $href := .link | default "/veranstaltungen/" }}
        <article class="event-card">
          <div class="event-card__date">
            <strong>{{ .day }}</strong><span>{{ .month }}</span>
          </div>
          <div class="event-card__body">
            <p class="event-card__meta">{{ .weekday }} · {{ .meta }}</p>
            <h3>{{ .title }}</h3>
            <a
              class="event-card__link"
              href="{{ $href | relURL }}"
              aria-label="Details zu {{ .title }}">→</a>
          </div>
        </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
